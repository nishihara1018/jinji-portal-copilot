name: Deploy to Amazon ECS via Copilot

on:
  push:
    branches:
      - main  # ここを main ブランチへの push に限定しています

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AWS Copilot CLI
        run: |
          curl -Lo copilot https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot
          sudo mv copilot /usr/local/bin/copilot

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Services
        run: |
          # 3つのサービスを順番にデプロイ（アプリ名 mai-app に戻している前提）
          copilot svc deploy --name api --env test
          copilot svc deploy --name bff --env test
          copilot svc deploy --name widget --env test