name: Deploy to Amazon ECS via Copilot

on:
  push:
    branches:
      - main  # ここを main ブランチへの push に限定しています

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AWS Copilot CLI
        run: |
          # 保存名を copilot から copilot-bin に変更
          curl -Lo copilot-bin https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-bin
          # /usr/local/bin/copilot として配置
          sudo mv copilot-bin /usr/local/bin/copilot

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Services
        run: |
          # 3つのサービスを順番にデプロイ
          copilot svc deploy --name api --env test --app mai-app
          copilot svc deploy --name bff --env test --app mai-app
          copilot svc deploy --name widget --env test --app mai-app